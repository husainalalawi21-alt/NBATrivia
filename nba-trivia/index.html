<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<title>NBA Trivia — 20-0</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="modernist.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<!-- Icon set: <svg class="ic"><use href="#i-name"></use></svg> -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.2 12 3.5l8.5 6.7V19a1.5 1.5 0 0 1-1.5 1.5h-4.5v-6h-5v6H5A1.5 1.5 0 0 1 3.5 19z"/></symbol>
    <symbol id="i-swords" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 17.5 3 6V3h3l11.5 11.5"/><path d="m13 19 6-6M16 16l4 4M19 21l2-2"/><path d="M14.5 6.5 18 3h3v3l-3.5 3.5"/><path d="m5 14 4 4M7 17l-3 3M3 19l2 2"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 16.5V21M7 3.5h10V9a5 5 0 0 1-10 0z"/><path d="M17 5h3v1.5A3.5 3.5 0 0 1 16.6 10M7 5H4v1.5A3.5 3.5 0 0 0 7.4 10"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20.5a8 8 0 0 1 16 0"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24" fill="currentColor"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.3 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2.5 4.5 13.5h7l-1 8 8.5-11h-7z"/></symbol>
    <symbol id="i-cross" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01" stroke-width="3"/></symbol>
    <symbol id="i-mystery" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6"/><path d="M12 17h.01" stroke-width="3"/></symbol>
    <symbol id="i-jersey" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 3.5a3.5 3.5 0 0 0 7 0l4 2v4.5l-2.5 1V20.5h-10V11L4.5 10V5.5z"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v11M7.5 8 12 3.5 16.5 8"/><path d="M5 13v5.5A2 2 0 0 0 7 20.5h10a2 2 0 0 0 2-2V13"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8.5" y="8.5" width="12" height="12" rx="3"/><path d="M15.5 8.5V6a2.5 2.5 0 0 0-2.5-2.5H6A2.5 2.5 0 0 0 3.5 6v7A2.5 2.5 0 0 0 6 15.5h2.5"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="m16 9.5 5 5M21 9.5l-5 5"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4H18a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3.5"/><path d="M10 16.5 5.5 12 10 7.5M5.5 12H16"/></symbol>
    <symbol id="i-at" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.8"/><path d="M15.8 8v5.2a2.8 2.8 0 0 0 5.6 0V12a9.4 9.4 0 1 0-3.7 7.5"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4.5 6v5.5c0 4.6 3.2 7.9 7.5 9.5 4.3-1.6 7.5-4.9 7.5-9.5V6z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-swap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4 3.5 7.5 7 11M3.5 7.5H17M17 13l3.5 3.5L17 20M20.5 16.5H7"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></symbol>
    <symbol id="i-medal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="15" r="5.5"/><path d="M8.6 10.6 6 3.5h4l2 4.2 2-4.2h4l-2.6 7.1"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.8 3.9 5.8 3.9 9s-1.3 6.2-3.9 9c-2.6-2.8-3.9-5.8-3.9-9S9.4 5.8 12 3z"/></symbol>
    <symbol id="i-ball" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3v18M5.7 5.7c3.3 3.5 3.3 9.1 0 12.6M18.3 5.7c-3.3 3.5-3.3 9.1 0 12.6"/></symbol>
    <symbol id="i-apple" viewBox="0 0 24 24" fill="currentColor"><path d="M16.4 12.8c0-2.5 2-3.7 2.1-3.8-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.7.9-.8 0-1.9-.9-3.1-.8-1.6 0-3.1.9-3.9 2.4-1.7 2.9-.4 7.2 1.2 9.5.8 1.2 1.7 2.4 3 2.4 1.2 0 1.7-.8 3.1-.8 1.5 0 1.9.8 3.1.8 1.3 0 2.1-1.2 2.9-2.3.9-1.3 1.3-2.6 1.3-2.7-.1 0-2.5-1-2.5-3.7zM14 5.4c.7-.8 1.1-2 1-3.1-1 0-2.2.7-2.9 1.5-.6.7-1.2 1.9-1 3 1.1.1 2.2-.6 2.9-1.4z"/></symbol>
    <symbol id="i-google" viewBox="0 0 24 24" fill="currentColor"><path d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3z" opacity=".9"/><path d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z" opacity=".75"/><path d="M6.4 14a6 6 0 0 1 0-4V7.4H3.1a10 10 0 0 0 0 9.2z" opacity=".6"/><path d="M12 6c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.4L6.4 10C7.2 7.7 9.4 6 12 6z"/></symbol>
  </defs>
</svg>

<div id="root"></div>
<template id="screens">
<div class="stage">
<div class="shell" data-screen="{{ screenName }}">

  <!-- ═══ WELCOME ═══ -->
  <sc-if value="{{ atWelcome }}" hint-placeholder-val="{{ true }}">
    <section class="scr scr-welcome">
      <button class="lang-pill" onClick="{{ toggleLang }}" lang="{{ otherLang }}"><svg class="ic"><use href="#i-globe"></use></svg>{{ L.lang.switch_to }}</button>
      <div class="w-art" aria-hidden="true">
        <svg class="w-court" viewBox="0 0 400 300" fill="none" stroke="currentColor" stroke-width="2"><path d="M0 40h400M200 40v260"/><circle cx="200" cy="170" r="62"/><circle cx="200" cy="170" r="18"/><path d="M40 300V40M360 300V40"/><path d="M110 40a90 90 0 0 0 180 0"/></svg>
        <div class="w-ball"><svg viewBox="0 0 100 100" fill="none" stroke="#2a0f00" stroke-width="3.2" stroke-linecap="round"><path d="M4 50h92M50 4v92M18 18c16 17 16 47 0 64M82 18c-16 17-16 47 0 64"/></svg></div>
      </div>
      <div class="w-copy">
        <div class="eyebrow"><svg class="ic"><use href="#i-ball"></use></svg>{{ appName }}</div>
        <h1 class="display w-title">{{ L.welcome.title }}</h1>
        <p class="lede">{{ L.welcome.lede }}</p>
      </div>
      <div class="w-actions">
        <button class="btn-main" onClick="{{ playGuest }}">{{ L.welcome.play_now }}<svg class="ic"><use href="#i-arrow"></use></svg></button>
        <button class="btn-soft" onClick="{{ goAuthEmail }}"><svg class="ic"><use href="#i-mail"></use></svg>{{ L.welcome.create_account }}</button>
        <sc-if value="{{ socialOn }}" hint-placeholder-val="{{ false }}">
          <div class="row2">
            <sc-if value="{{ hasApple }}"><button class="btn-soft" onClick="{{ authApple }}"><svg class="ic"><use href="#i-apple"></use></svg>Apple</button></sc-if>
            <sc-if value="{{ hasGoogle }}"><button class="btn-soft" onClick="{{ authGoogle }}"><svg class="ic"><use href="#i-google"></use></svg>Google</button></sc-if>
          </div>
        </sc-if>
        <button class="btn-link" onClick="{{ goSignIn }}">{{ L.welcome.have_account }} <b>{{ L.welcome.sign_in }}</b></button>
      </div>
    </section>
  </sc-if>

  <!-- ═══ SIGN UP / SIGN IN ═══ -->
  <sc-if value="{{ atAuth }}" hint-placeholder-val="{{ false }}">
    <section class="scr scr-form">
      <button class="back" onClick="{{ backToWelcome }}" aria-label="{{ L.common.back }}"><svg class="ic"><use href="#i-back"></use></svg>{{ L.common.back }}</button>
      <h2 class="display h-xl">{{ authTitle }}</h2>
      <p class="muted">{{ authSub }}</p>
      <div class="seg" role="tablist">
        <sc-for list="{{ authTabs }}" as="t" hint-placeholder-count="2"><button class="seg-btn" aria-selected="{{ t.on }}" onClick="{{ t.pick }}">{{ t.label }}</button></sc-for>
      </div>
      <label class="fld"><span>{{ L.auth.email }}</span><input class="inp" dir="ltr" type="email" autocomplete="email" placeholder="you@example.com" value="{{ authEmail }}" onChange="{{ setAuthEmail }}"></label>
      <label class="fld"><span>{{ L.auth.password }}</span><input class="inp" dir="ltr" type="password" autocomplete="{{ passAutocomplete }}" placeholder="{{ L.auth.password_hint }}" value="{{ authPass }}" onChange="{{ setAuthPass }}" onKeyDown="{{ authKey }}"></label>
      <sc-if value="{{ authHasErrors }}" hint-placeholder-val="{{ false }}"><div class="note note-warn"><sc-for list="{{ authErrorList }}" as="e" hint-placeholder-count="1"><div>{{ e }}</div></sc-for></div></sc-if>
      <button class="btn-main" onClick="{{ submitEmailAuth }}" disabled="{{ busy }}">{{ authCta }}<svg class="ic"><use href="#i-arrow"></use></svg></button>
      <sc-if value="{{ socialOn }}" hint-placeholder-val="{{ false }}">
        <div class="or"><span>{{ L.common.or }}</span></div>
        <div class="row2">
          <sc-if value="{{ hasApple }}"><button class="btn-soft" onClick="{{ authApple }}"><svg class="ic"><use href="#i-apple"></use></svg>Apple</button></sc-if>
          <sc-if value="{{ hasGoogle }}"><button class="btn-soft" onClick="{{ authGoogle }}"><svg class="ic"><use href="#i-google"></use></svg>Google</button></sc-if>
        </div>
      </sc-if>
      <p class="fine">{{ L.auth.fine }}</p>
    </section>
  </sc-if>

  <!-- ═══ USERNAME ═══ -->
  <sc-if value="{{ atUsername }}" hint-placeholder-val="{{ false }}">
    <section class="scr scr-form">
      <sc-if value="{{ regFlow }}"><div class="steps"><sc-for list="{{ regDots }}" as="d" hint-placeholder-count="3"><i data-on="{{ d }}"></i></sc-for></div></sc-if>
      <sc-if value="{{ notRegFlow }}"><button class="back" onClick="{{ goProfile }}" aria-label="{{ L.common.back }}"><svg class="ic"><use href="#i-back"></use></svg>{{ L.common.back }}</button></sc-if>
      <h2 class="display h-xl">{{ L.username.title }}</h2>
      <p class="muted">{{ L.username.sub }}</p>
      <div class="handle-input" dir="ltr"><span>@</span><input class="inp-bare" placeholder="ballgod" autocomplete="off" autocapitalize="off" spellcheck="false" value="{{ unameDraft }}" onChange="{{ setUname }}" onKeyDown="{{ unameKey }}"></div>
      <div class="hint" data-ok="{{ unameOk }}">{{ unameStatus }}</div>
      <button class="btn-main push-down" onClick="{{ claimUsername }}" disabled="{{ unameInvalid }}">{{ L.common.continue }}<svg class="ic"><use href="#i-arrow"></use></svg></button>
    </section>
  </sc-if>

  <!-- ═══ TEAM PICKER ═══ -->
  <sc-if value="{{ atTeamPick }}" hint-placeholder-val="{{ false }}">
    <section class="scr scr-teampick">
      <div class="tp-head">
        <sc-if value="{{ regFlow }}"><div class="steps"><sc-for list="{{ regDots }}" as="d" hint-placeholder-count="3"><i data-on="{{ d }}"></i></sc-for></div></sc-if>
        <sc-if value="{{ notRegFlow }}"><button class="back" onClick="{{ teamPickBack }}" aria-label="{{ L.common.back }}"><svg class="ic"><use href="#i-back"></use></svg>{{ L.common.back }}</button></sc-if>
        <h2 class="display h-xl">{{ L.teampick.title }}</h2>
        <p class="muted">{{ L.teampick.sub }}</p>
        <label class="search"><svg class="ic"><use href="#i-search"></use></svg><input class="inp-bare" placeholder="{{ L.teampick.search }}" value="{{ teamSearch }}" onChange="{{ setTeamSearch }}"></label>
      </div>
      <div class="team-grid">
        <sc-for list="{{ teamList }}" as="t" hint-placeholder-count="12">
          <button class="team-tile" aria-pressed="{{ t.pressed }}" onClick="{{ t.pick }}">
            <span class="tchip" style="{{ t.chip }}">{{ t.abbr }}</span>
            <span class="tt-text"><b>{{ t.city }}</b><span>{{ t.name }}</span></span>
            <sc-if value="{{ t.selected }}"><svg class="ic tt-check"><use href="#i-check"></use></svg></sc-if>
          </button>
        </sc-for>
        <sc-if value="{{ noTeamsFound }}"><div class="empty-line">{{ noTeamText }}</div></sc-if>
      </div>
      <div class="dock">
        <button class="btn-main" onClick="{{ saveTeam }}" disabled="{{ noTeamChosen }}">{{ teamCta }}</button>
        <sc-if value="{{ regFlow }}"><button class="btn-link" onClick="{{ skipTeam }}">{{ L.teampick.skip }}</button></sc-if>
      </div>
    </section>
  </sc-if>

  <!-- ═══ READY ═══ -->
  <sc-if value="{{ atReady }}" hint-placeholder-val="{{ false }}">
    <section class="scr scr-form scr-ready">
      <div class="steps"><sc-for list="{{ regDots }}" as="d" hint-placeholder-count="3"><i data-on="{{ d }}"></i></sc-for></div>
      <span class="tchip tchip-xl" style="{{ myTeamChip }}">{{ myTeamAbbr }}</span>
      <h2 class="display h-xl">{{ readyTitle }}</h2>
      <p class="muted">{{ readyLine }}</p>
      <div class="ladder ladder-tall">
        <sc-for list="{{ ladderSteps }}" as="l" hint-placeholder-count="6"><div class="lad" data-tier="{{ l.tier }}"><i></i><b>{{ l.label }}</b><span>{{ l.count }}</span></div></sc-for>
      </div>
      <button class="btn-main push-down" onClick="{{ startStreak }}">{{ L.ready.cta }}<svg class="ic"><use href="#i-arrow"></use></svg></button>
    </section>
  </sc-if>

  <!-- ═══ HOME ═══ -->
  <sc-if value="{{ atHome }}" hint-placeholder-val="{{ false }}">
    <section class="scr scr-home">
      <header class="topbar h-top">
        <button class="me" onClick="{{ goProfile }}">
          <span class="avatar" data-member="{{ isMember }}">{{ avatarInitial }}</span>
          <span class="me-text"><b>{{ greeting }}</b><small>{{ homeSubline }}</small></span>
        </button>
        <sc-if value="{{ isMember }}"><button class="pill pill-rank" onClick="{{ goBoard }}"><svg class="ic"><use href="#i-trophy"></use></svg>{{ rankPill }}</button></sc-if>
        <sc-if value="{{ isGuest }}"><button class="pill pill-cta" onClick="{{ goAuthEmail }}">{{ L.common.sign_up }}</button></sc-if>
      </header>

      <div class="h-msgs"><sc-if value="{{ poolExhausted }}"><div class="note">{{ exhaustedMsg }}</div></sc-if><sc-if value="{{ hasInbox }}"><button class="inbox" onClick="{{ openInbox }}"><span class="avatar sm">{{ inboxInitial }}</span><span class="grow"><b>{{ inboxTitle }}</b><small>{{ inboxSub }}</small></span><span class="pill pill-cta">{{ L.common.play }}</span></button></sc-if></div>

      <button class="hero h-hero" onClick="{{ startStreak }}">
        <div class="hero-top"><span class="chip chip-fire"><svg class="ic"><use href="#i-flame"></use></svg>{{ L.modes.streak }}</span><span class="hero-best">{{ heroBest }}</span></div>
        <div class="hero-title display">{{ heroPrompt }}</div>
        <div class="hero-sub">{{ heroSub }}</div>
        <div class="ladder">
          <sc-for list="{{ ladderSteps }}" as="l" hint-placeholder-count="6"><div class="lad" data-tier="{{ l.tier }}" data-done="{{ l.done }}"><i></i><b>{{ l.short }}</b></div></sc-for>
        </div>
        <span class="btn-main as-div">{{ heroCta }}<svg class="ic"><use href="#i-arrow"></use></svg></span>
      </button>

      <div class="h-side">
        <div class="h-label"><b>{{ todayLabel }}</b><small><svg class="ic"><use href="#i-clock"></use></svg>{{ dailyNext }}</small></div>
        <div class="today">
          <button class="day-card xo-card" onClick="{{ openXo }}">
            <span class="tile-ic ic-xo"><svg class="ic"><use href="#i-cross"></use></svg></span>
            <span class="day-text"><b>{{ L.modes.crossover }}</b><small>{{ xoSub }}</small></span>
            <span class="xo-dots"><sc-for list="{{ xoDots }}" as="d" hint-placeholder-count="3"><i data-level="{{ d.level }}" data-state="{{ d.state }}">{{ d.label }}</i></sc-for></span>
          </button>
          <button class="day-card daily-card" onClick="{{ startDaily }}" data-done="{{ dailyDone }}">
            <span class="tile-ic ic-daily"><svg class="ic"><use href="#i-calendar"></use></svg></span>
            <span class="day-text"><b>{{ L.home.daily }}</b><small>{{ dailyTheme }}</small></span>
            <span class="day-foot"><sc-if value="{{ dailyDone }}"><span class="pill pill-done"><svg class="ic"><use href="#i-check"></use></svg>{{ dailyScore }}</span></sc-if><sc-if value="{{ dailyOpen }}"><small>{{ dailySub }}</small></sc-if></span>
          </button>
        </div>
        <div class="h-label"><b>{{ moreGames }}</b></div>
        <div class="modes h-modes">
          <sc-for list="{{ modeTiles }}" as="m" hint-placeholder-count="3">
            <button class="tile" onClick="{{ m.pick }}" data-kind="{{ m.kind }}">
              <sc-if value="{{ m.isTeam }}"><span class="tchip" style="{{ m.chip }}">{{ m.abbr }}</span></sc-if>
              <sc-if value="{{ m.isIcon }}"><span class="tile-ic"><svg class="ic"><use href="{{ m.icon }}"></use></svg></span></sc-if>
              <span class="tile-text"><b>{{ m.name }}</b><small>{{ m.desc }}</small></span>
              <sc-if value="{{ m.hasStat }}"><span class="tile-stat">{{ m.stat }}</span></sc-if>
            </button>
          </sc-for>
        </div>
      </div>
    </section>
  </sc-if>

  <!-- ═══ CROSSOVER ═══ -->
  <sc-if value="{{ atXo }}" hint-placeholder-val="{{ false }}">
    <section class="scr scr-xo">
      <header class="topbar"><button class="back" onClick="{{ goHome }}" aria-label="{{ L.common.back }}"><svg class="ic"><use href="#i-back"></use></svg>{{ L.common.home }}</button><span class="pill pill-time"><svg class="ic"><use href="#i-clock"></use></svg>{{ xoNewIn }}</span></header>
      <div class="xo-hero">
        <span class="tile-ic ic-xo xl"><svg class="ic"><use href="#i-cross"></use></svg></span>
        <h2 class="display h-lg">{{ L.xo.title }}</h2>
        <p class="muted">{{ L.xo.sub }}</p>
      </div>
      <div class="xo-levels">
        <sc-for list="{{ xoLevels }}" as="x" hint-placeholder-count="3">
          <button class="xo-lvl" data-level="{{ x.level }}" data-perfect="{{ x.perfect }}" onClick="{{ x.pick }}">
            <span class="xo-mark"><sc-if value="{{ x.hidden }}">?</sc-if><sc-if value="{{ x.played }}"><svg class="ic"><use href="#i-user"></use></svg></sc-if><sc-if value="{{ x.perfect }}"><svg class="ic"><use href="#i-check"></use></svg></sc-if></span>
            <span class="xo-text">
              <small class="xo-lvl-name">{{ x.label }} · {{ x.desc }}</small>
              <sc-if value="{{ x.hidden }}"><b>{{ L.xo.hidden }}</b><small>{{ L.xo.reveal }}</small></sc-if>
              <sc-if value="{{ x.shown }}"><b>{{ x.name }}</b><small>{{ x.status }}</small></sc-if>
            </span>
            <span class="pill xo-cta">{{ x.cta }}</span>
          </button>
        </sc-for>
      </div>
    </section>
  </sc-if>

  <sc-if value="{{ atXoIntro }}" hint-placeholder-val="{{ false }}">
    <section class="scr scr-xo-intro">
      <header class="topbar"><button class="back" onClick="{{ openXo }}" aria-label="{{ L.common.back }}"><svg class="ic"><use href="#i-back"></use></svg>{{ L.xo.back }}</button></header>
      <div class="xo-reveal" data-level="{{ xoIntroLevel }}">
        <div class="eyebrow">{{ xoIntroKicker }}</div>
        <div class="xo-num">{{ xoIntroMark }}</div>
        <h2 class="display xo-name">{{ xoIntroName }}</h2>
        <div class="xo-meta"><b dir="ltr">{{ xoIntroYears }}</b><span>{{ xoIntroTeams }}</span></div>
        <sc-if value="{{ xoIntroHasStatus }}"><span class="pill pill-done">{{ xoIntroStatus }}</span></sc-if>
      </div>
      <p class="muted center xo-rule">{{ xoIntroLine }}</p>
      <div class="dock"><button class="btn-main" onClick="{{ xoStart }}">{{ xoIntroCta }}<svg class="ic"><use href="#i-arrow"></use></svg></button></div>
    </section>
  </sc-if>

  <!-- ═══ DELETE ACCOUNT ═══ -->
  <sc-if value="{{ atDelete }}" hint-placeholder-val="{{ false }}">
    <section class="scr scr-delete">
      <header class="topbar"><button class="back" onClick="{{ cancelDelete }}" aria-label="{{ L.common.back }}"><svg class="ic"><use href="#i-back"></use></svg>{{ L.nav.profile }}</button></header>
      <div class="del-card">
        <span class="del-ic"><svg class="ic"><use href="#i-close"></use></svg></span>
        <h2 class="display h-lg">{{ L.delete.title }}</h2>
        <p class="muted">{{ deleteBody }}</p>
        <sc-if value="{{ deleteHasError }}"><div class="note">{{ deleteError }}</div></sc-if>
      </div>
      <div class="dock">
        <button class="btn-main" onClick="{{ cancelDelete }}">{{ L.delete.keep }}</button>
        <button class="btn-danger" onClick="{{ confirmDelete }}" disabled="{{ deleteBusy }}">{{ deleteCta }}</button>
      </div>
    </section>
  </sc-if>

  <!-- ═══ GAME ═══ -->
  <sc-if value="{{ atGame }}" hint-placeholder-val="{{ false }}">
    <section class="scr scr-game" data-urgent="{{ urgent }}">
      <header class="g-top">
        <button class="icon-btn" onClick="{{ quitGame }}" aria-label="{{ L.common.exit }}"><svg class="ic"><use href="#i-close"></use></svg></button>
        <div class="tier" data-tier="{{ tierKey }}">{{ tierName }}<sc-if value="{{ hasStageCount }}"><span>{{ stageCount }}</span></sc-if></div>
        <div class="g-right">
          <sc-if value="{{ gameHasClock }}"><div class="clock" data-urgent="{{ urgent }}"><svg class="ic"><use href="#i-clock"></use></svg>{{ clock }}</div></sc-if>
          <sc-if value="{{ showScore }}"><div class="score-chip">{{ scoreText }}</div></sc-if>
          <sc-if value="{{ showStreak }}"><div class="streak-chip" data-hot="{{ hot }}"><svg class="ic"><use href="#i-flame"></use></svg>{{ gameStreak }}</div></sc-if>
        </div>
      </header>
      <div class="segs" data-tier="{{ tierKey }}" data-endless="{{ endless }}"><sc-for list="{{ segs }}" as="g" hint-placeholder-count="5"><i data-on="{{ g }}"></i></sc-for></div>
      <div class="timer"><i style="{{ timerStyle }}"></i></div>

      <sc-if value="{{ gameVisible }}" hint-placeholder-val="{{ true }}">
        <div class="g-body">
          <div class="q-card" data-clues="{{ qIsClues }}">
            <div class="q-main">
            <div class="q-cat" dir="auto">{{ qKicker }}</div>
            <sc-if value="{{ qIsPlain }}" hint-placeholder-val="{{ true }}"><h2 class="q-text" dir="auto" data-long="{{ qLong }}">{{ qText }}</h2></sc-if>
            <sc-if value="{{ qIsClues }}" hint-placeholder-val="{{ false }}">
              <h2 class="q-text">{{ L.game.who_am_i }}</h2>
              <div class="clues">
                <sc-for list="{{ clueRows }}" as="c" hint-placeholder-count="5">
                  <div class="clue" data-locked="{{ c.locked }}" data-new="{{ c.isNew }}">
                    <span class="clue-n">{{ c.n }}</span>
                    <div class="clue-body" dir="auto">
                      <sc-if value="{{ c.locked }}"><span class="clue-lock">{{ L.common.locked }}</span></sc-if>
                      <sc-if value="{{ c.isText }}"><span>{{ c.text }}</span></sc-if>
                      <sc-if value="{{ c.isPath }}"><span class="path"><sc-for list="{{ c.teams }}" as="tm" hint-placeholder-count="3"><b>{{ tm.name }}</b></sc-for></span></sc-if>
                      <sc-if value="{{ c.isNumbers }}"><span class="nums"><sc-for list="{{ c.numbers }}" as="nm" hint-placeholder-count="2"><b>{{ nm }}</b></sc-for></span></sc-if>
                      <sc-if value="{{ c.isAwards }}"><span class="awards"><sc-for list="{{ c.list }}" as="aw" hint-placeholder-count="3"><b>{{ aw }}</b></sc-for></span></sc-if>
                    </div>
                  </div>
                </sc-for>
              </div>
              <sc-if value="{{ hasLockedClues }}"><div class="clue-more"><svg class="ic"><use href="#i-lock"></use></svg>{{ lockedCluesText }}</div></sc-if>
              <sc-if value="{{ showGuessInline }}">
                <div class="guess-inline"><input class="inp" dir="auto" placeholder="{{ L.game.type_name }}" autocomplete="off" autocapitalize="words" spellcheck="false" value="{{ guessText }}" onChange="{{ setGuess }}" onKeyDown="{{ guessKey }}"><button class="btn-main" onClick="{{ submitGuess }}" disabled="{{ guessEmpty }}">{{ L.game.guess }}</button></div>
              </sc-if>
            </sc-if>
            </div>
            <sc-if value="{{ showFeedback }}" hint-placeholder-val="{{ false }}">
              <div class="feedback" data-ok="{{ feedbackOk }}">
                <span class="fb-ic"><sc-if value="{{ feedbackOk }}"><svg class="ic"><use href="#i-check"></use></svg></sc-if><sc-if value="{{ feedbackBad }}"><svg class="ic"><use href="#i-close"></use></svg></sc-if></span>
                <div class="grow">
                  <div class="fb-title">{{ feedbackTitle }}<sc-if value="{{ feedbackHasTrail }}"><span>{{ feedbackTrail }}</span></sc-if></div>
                  <div class="fb-sub" dir="auto">{{ feedbackSub }}</div>
                </div>
              </div>
            </sc-if>
          </div>
        </div>

        <sc-if value="{{ showAnswers }}" hint-placeholder-val="{{ true }}">
          <div class="answers" data-two="{{ qIsClues }}">
            <sc-for list="{{ answers }}" as="a" hint-placeholder-count="4">
              <button class="ans" data-state="{{ a.state }}" onClick="{{ a.pick }}" disabled="{{ a.disabled }}">
                <span class="key">{{ a.letter }}</span>
                <span class="grow" dir="auto">{{ a.text }}</span>
                <sc-if value="{{ a.isRight }}"><svg class="ic mark"><use href="#i-check"></use></svg></sc-if>
                <sc-if value="{{ a.isWrong }}"><svg class="ic mark"><use href="#i-close"></use></svg></sc-if>
              </button>
            </sc-for>
          </div>
        </sc-if>

        <sc-if value="{{ showNextClue }}">
          <button class="btn-soft next-clue" onClick="{{ nextClue }}" disabled="{{ noMoreClues }}"><svg class="ic"><use href="#i-mystery"></use></svg><span class="stack"><b>{{ nextClueLabel }}</b><small>{{ nextClueWorth }}</small></span></button>
        </sc-if>
      </sc-if>
      </sc-if>


      <sc-if value="{{ showGain }}" hint-placeholder-val="{{ false }}">
        <div class="gain"><b dir="ltr">{{ gainPts }}</b><sc-if value="{{ gainExtra }}"><span>{{ gainExtraText }}</span></sc-if></div>
      </sc-if>
      <sc-if value="{{ showMilestone }}" hint-placeholder-val="{{ false }}">
        <div class="milestone-wrap"><div class="milestone" data-tier="{{ milestoneTier }}"><small>{{ milestoneKicker }}</small>{{ milestoneText }}</div></div>
      </sc-if>
    </section>
  </sc-if>

  <!-- ═══ RESULT ═══ -->
  <sc-if value="{{ atResult }}" hint-placeholder-val="{{ false }}">
    <section class="scr scr-result">
      <div class="r-sum">
        <div class="r-hero" data-record="{{ isRecord }}">
          <sc-if value="{{ isRecord }}"><div class="confetti" aria-hidden="true"><sc-for list="{{ confetti }}" as="c" hint-placeholder-count="0"><i style="{{ c }}"></i></sc-for></div></sc-if>
          <div class="eyebrow">{{ resultKicker }}</div>
          <div class="r-num display">{{ resultNumber }}</div>
          <div class="r-line">{{ resultLine }}</div>
          <div class="r-chips">
            <sc-if value="{{ hasReached }}"><span class="tier" data-tier="{{ reachedTier }}">{{ reachedText }}</span></sc-if>
            <sc-if value="{{ isRecord }}"><span class="chip chip-gold">{{ newBestText }}</span></sc-if>
          </div>
        </div>
        <div class="stats4"><sc-for list="{{ resultStats }}" as="s" hint-placeholder-count="4"><div class="stat"><small>{{ s.label }}</small><b>{{ s.value }}</b></div></sc-for></div>
        <div class="r-actions">
          <button class="btn-main" onClick="{{ playAgain }}">{{ playAgainLabel }}<svg class="ic"><use href="#i-arrow"></use></svg></button>
          <div class="row2">
            <sc-if value="{{ resultIsXo }}"><button class="btn-soft" onClick="{{ goXo }}"><svg class="ic"><use href="#i-cross"></use></svg>{{ L.xo.other_players }}</button></sc-if>
            <sc-if value="{{ canChallenge }}"><button class="btn-soft" onClick="{{ challengeFriend }}"><svg class="ic"><use href="#i-swords"></use></svg>{{ L.result.challenge }}</button></sc-if>
            <button class="btn-soft" onClick="{{ goShare }}"><svg class="ic"><use href="#i-share"></use></svg>{{ L.common.share }}</button>
            <sc-if value="{{ homeAfterResult }}"><button class="btn-soft" onClick="{{ goHome }}"><svg class="ic"><use href="#i-home"></use></svg>{{ L.common.home }}</button></sc-if>
          </div>
        </div>
        <sc-if value="{{ hasNewBadges }}" hint-placeholder-val="{{ false }}">
          <div class="unlocked"><svg class="ic"><use href="#i-medal"></use></svg><span>{{ L.result.unlocked }} <b>{{ newBadgesText }}</b></span></div>
        </sc-if>
        <sc-if value="{{ isGuest }}" hint-placeholder-val="{{ false }}">
          <div class="card claim"><span class="grow"><b>{{ L.result.save_title }}</b><small>{{ L.result.save_sub }}</small></span><button class="pill pill-cta" onClick="{{ goAuthEmail }}">{{ L.common.sign_up }}</button></div>
        </sc-if>
      </div>
      <div class="r-review">
        <div class="section-title">{{ L.result.answers }} <span>{{ reviewCount }}</span></div>
        <div class="review-list">
          <sc-for list="{{ reviewRows }}" as="r" hint-placeholder-count="8">
            <div class="rv" data-ok="{{ r.ok }}">
              <span class="rv-dot"><sc-if value="{{ r.ok }}"><svg class="ic"><use href="#i-check"></use></svg></sc-if><sc-if value="{{ r.bad }}"><svg class="ic"><use href="#i-close"></use></svg></sc-if></span>
              <div class="grow"><div class="rv-q" dir="auto">{{ r.q }}</div><div class="rv-d" dir="auto">{{ r.detail }}</div></div>
              <b class="rv-pts">{{ r.pts }}</b>
            </div>
          </sc-for>
        </div>
      </div>
    </section>
  </sc-if>

  <!-- ═══ SHARE ═══ -->
  <sc-if value="{{ atShare }}" hint-placeholder-val="{{ false }}">
    <section class="scr scr-share">
      <header class="topbar"><button class="back" onClick="{{ shareBack }}" aria-label="{{ L.common.back }}"><svg class="ic"><use href="#i-back"></use></svg>{{ L.common.back }}</button></header>
      <div class="story">
        <div class="story-top"><svg class="ic"><use href="#i-ball"></use></svg>{{ appName }}</div>
        <div class="story-mid">
          <span class="chip chip-fire"><svg class="ic"><use href="#i-flame"></use></svg>{{ shareKicker }}</span>
          <div class="story-num display">{{ shareNumber }}</div>
          <div class="story-quote display">{{ L.share.quote }}</div>
        </div>
        <div class="story-foot"><span class="tchip" style="{{ myTeamChip }}">{{ myTeamAbbr }}</span><span class="grow"><b>{{ handle }}</b><small>{{ shareFooter }}</small></span><b class="story-rank">{{ globalRank }}</b></div>
      </div>
      <div class="row2">
        <button class="btn-main" onClick="{{ shareNative }}"><svg class="ic"><use href="#i-share"></use></svg>{{ L.common.share }}</button>
        <button class="btn-soft" onClick="{{ copyShare }}"><svg class="ic"><use href="#i-copy"></use></svg>{{ copyLabel }}</button>
      </div>
      <p class="fine center">{{ L.share.fine }}</p>
    </section>
  </sc-if>

  <!-- ═══ RANKS ═══ -->
  <sc-if value="{{ atBoard }}" hint-placeholder-val="{{ false }}">
    <section class="scr scr-board">
      <header class="page-head"><h2 class="display h-lg">{{ L.ranks.title }}</h2><span class="muted">{{ boardCaption }}</span></header>
      <div class="seg"><sc-for list="{{ boardScopes }}" as="b" hint-placeholder-count="2"><button class="seg-btn" aria-selected="{{ b.on }}" onClick="{{ b.pick }}">{{ b.label }}</button></sc-for></div>
      <div class="chips"><sc-for list="{{ boardGames }}" as="g" hint-placeholder-count="8"><button class="chip-btn" aria-pressed="{{ g.on }}" onClick="{{ g.pick }}">{{ g.label }}</button></sc-for></div>
      <div class="chips"><sc-for list="{{ boardPeriods }}" as="p" hint-placeholder-count="3"><button class="chip-btn" aria-pressed="{{ p.on }}" onClick="{{ p.pick }}">{{ p.label }}</button></sc-for></div>
      <div class="pts-legend"><small>{{ L.ranks.per_answer }}</small><sc-for list="{{ pointsLegend }}" as="x" hint-placeholder-count="6"><span class="pts" data-tier="{{ x.tier }}"><span>{{ x.label }}</span><b>{{ x.pts }}</b></span></sc-for></div>
      <sc-if value="{{ boardLoadingNow }}"><div class="board-list"><sc-for list="{{ skeleton }}" as="k" hint-placeholder-count="6"><div class="brow skel"></div></sc-for></div></sc-if>
      <sc-if value="{{ boardNone }}">
        <div class="empty">
          <span class="empty-ic"><svg class="ic"><use href="#i-trophy"></use></svg></span>
          <b>{{ boardNoneTitle }}</b>
          <p>{{ boardNoneLine }}</p>
          <button class="btn-main" onClick="{{ boardNoneAction }}">{{ boardNoneCta }}</button>
        </div>
      </sc-if>
      <sc-if value="{{ boardHasRows }}" hint-placeholder-val="{{ true }}">
        <div class="board-list">
          <sc-for list="{{ boardRows }}" as="r" hint-placeholder-count="10">
            <div class="brow" data-me="{{ r.me }}" data-top="{{ r.top }}">
              <span class="brank" data-medal="{{ r.medal }}">{{ r.rank }}</span>
              <span class="avatar sm">{{ r.initial }}</span>
              <span class="grow"><b>{{ r.name }}</b><small>{{ r.team }}</small></span>
              <b class="bval">{{ r.value }}</b>
            </div>
          </sc-for>
        </div>
      </sc-if>
      <div class="me-row">
        <span class="brank">{{ myRank }}</span>
        <span class="grow"><b>{{ L.ranks.you }}</b><small>{{ myRankSub }}</small></span>
        <sc-if value="{{ isMember }}"><b class="bval">{{ myRankValue }}</b></sc-if>
        <sc-if value="{{ isGuest }}"><button class="pill pill-cta" onClick="{{ goAuthEmail }}">{{ L.common.sign_up }}</button></sc-if>
      </div>
    </section>
  </sc-if>

  <!-- ═══ TEAM HUB ═══ -->
  <sc-if value="{{ atTeamHub }}" hint-placeholder-val="{{ false }}">
    <section class="scr scr-hub">
      <header class="topbar"><button class="back" onClick="{{ goHome }}" aria-label="{{ L.common.back }}"><svg class="ic"><use href="#i-back"></use></svg>{{ L.common.home }}</button><button class="pill" onClick="{{ goTeamPick }}"><svg class="ic"><use href="#i-swap"></use></svg>{{ L.hub.change }}</button></header>
      <div class="hub-hero" style="{{ hubVars }}">
        <span class="tchip tchip-xl" style="{{ myTeamChip }}">{{ myTeamAbbr }}</span>
        <div class="eyebrow">{{ L.hub.your_team }}</div>
        <h2 class="display h-lg">{{ hubHeadline }}</h2>
        <p class="muted">{{ L.hub.sub }}</p>
      </div>
      <div class="stats3"><sc-for list="{{ hubStats }}" as="s" hint-placeholder-count="3"><div class="stat"><small>{{ s.label }}</small><b>{{ s.value }}</b></div></sc-for></div>
      <div class="section-title">{{ L.hub.focus }}</div>
      <div class="chips wrap"><sc-for list="{{ hubCats }}" as="c" hint-placeholder-count="6"><button class="chip-btn" aria-pressed="{{ c.on }}" onClick="{{ c.pick }}">{{ c.label }}</button></sc-for></div>
      <div class="dock">
        <button class="btn-main" onClick="{{ startTeamRun }}">{{ hubCta }}<svg class="ic"><use href="#i-arrow"></use></svg></button>
        <p class="fine center">{{ hubLadder }}</p>
      </div>
    </section>
  </sc-if>

  <!-- ═══ PROFILE ═══ -->
  <sc-if value="{{ atProfile }}" hint-placeholder-val="{{ false }}">
    <section class="scr scr-profile">
      <div class="p-head card">
        <span class="avatar xl" data-member="{{ isMember }}">{{ avatarInitial }}</span>
        <div class="grow">
          <div class="p-name">{{ handle }}</div>
          <button class="team-link" onClick="{{ changeTeam }}"><span class="tchip sm" style="{{ myTeamChip }}">{{ myTeamAbbr }}</span>{{ teamLinkLabel }}<svg class="ic"><use href="#i-chev"></use></svg></button>
          <div class="xp"><div class="xp-top"><b>{{ levelText }}</b><span>{{ xpLine }}</span></div><div class="bar"><i style="{{ xpWidth }}"></i></div></div>
        </div>
      </div>
      <sc-if value="{{ isGuest }}"><div class="card claim"><span class="grow"><b>{{ L.profile.guest_title }}</b><small>{{ L.profile.guest_sub }}</small></span><button class="pill pill-cta" onClick="{{ goAuthEmail }}">{{ L.common.sign_up }}</button></div></sc-if>
      <div class="stats3"><sc-for list="{{ profileStats }}" as="s" hint-placeholder-count="6"><div class="stat"><small>{{ s.label }}</small><b>{{ s.value }}</b></div></sc-for></div>
      <div class="p-scroll">
      <div class="section-title">{{ L.profile.achievements }} <span>{{ badgeCount }}</span></div>
      <div class="badges">
        <sc-for list="{{ badges }}" as="b" hint-placeholder-count="10">
          <div class="badge" data-on="{{ b.on }}" title="{{ b.desc }}">
            <span class="medal"><sc-if value="{{ b.on }}"><svg class="ic"><use href="#i-medal"></use></svg></sc-if><sc-if value="{{ b.off }}"><svg class="ic"><use href="#i-lock"></use></svg></sc-if></span>
            <b>{{ b.name }}</b><small>{{ b.desc }}</small>
          </div>
        </sc-for>
      </div>
      <div class="menu card">
        <div class="mi mi-static"><svg class="ic"><use href="#i-globe"></use></svg><span class="grow">{{ L.lang.label }}</span><div class="seg seg-sm" role="tablist"><sc-for list="{{ langOpts }}" as="o" hint-placeholder-count="2"><button class="seg-btn" aria-selected="{{ o.on }}" lang="{{ o.code }}" onClick="{{ o.pick }}">{{ o.label }}</button></sc-for></div></div>
        <button class="mi" onClick="{{ toggleSound }}"><svg class="ic"><use href="{{ soundIcon }}"></use></svg><span class="grow">{{ L.profile.sound }}</span><span class="switch" data-on="{{ soundOn }}"><i></i></span></button>
        <sc-if value="{{ isMember }}"><button class="mi" onClick="{{ changeUsername }}"><svg class="ic"><use href="#i-at"></use></svg><span class="grow">{{ L.profile.change_username }}</span><svg class="ic chev"><use href="#i-chev"></use></svg></button></sc-if>
        <button class="mi" onClick="{{ changeTeam }}"><svg class="ic"><use href="#i-swap"></use></svg><span class="grow">{{ teamMenuLabel }}</span><svg class="ic chev"><use href="#i-chev"></use></svg></button>
        <sc-if value="{{ isAdmin }}"><button class="mi" onClick="{{ goAdmin }}"><svg class="ic"><use href="#i-shield"></use></svg><span class="grow">{{ L.profile.engine }}<small>{{ engineSummaryLine }}</small></span><svg class="ic chev"><use href="#i-chev"></use></svg></button></sc-if>
        <sc-if value="{{ isMember }}"><button class="mi mi-danger" onClick="{{ signOut }}"><svg class="ic"><use href="#i-logout"></use></svg><span class="grow">{{ L.common.sign_out }}</span></button></sc-if>
        <a class="mi" href="{{ privacyUrl }}" target="_blank" rel="noopener"><svg class="ic"><use href="#i-shield"></use></svg><span class="grow">{{ L.profile.privacy }}</span><svg class="ic chev"><use href="#i-chev"></use></svg></a>
        <a class="mi" href="{{ supportUrl }}" target="_blank" rel="noopener"><svg class="ic"><use href="#i-mail"></use></svg><span class="grow">{{ L.profile.support }}</span><svg class="ic chev"><use href="#i-chev"></use></svg></a>
        <sc-if value="{{ isMember }}"><button class="mi mi-quiet" onClick="{{ goDelete }}"><svg class="ic"><use href="#i-close"></use></svg><span class="grow">{{ L.profile.delete_account }}</span></button></sc-if>
        <sc-if value="{{ isGuest }}"><button class="mi" onClick="{{ goSignIn }}"><svg class="ic"><use href="#i-user"></use></svg><span class="grow">{{ L.common.sign_in }}</span><svg class="ic chev"><use href="#i-chev"></use></svg></button></sc-if>
      </div>
      <p class="fine center">{{ L.profile.credits }}<br>{{ L.profile.not_affiliated }}</p>
      </div>
    </section>
  </sc-if>

  <!-- ═══ BATTLES ═══ -->
  <sc-if value="{{ atH2H }}" hint-placeholder-val="{{ false }}">
    <section class="scr scr-h2h">
      <header class="page-head"><h2 class="display h-lg">{{ L.battles.title }}</h2><span class="record"><b data-k="w">{{ wins }}W</b><b data-k="l">{{ losses }}L</b><b data-k="t">{{ ties }}T</b></span></header>
      <div class="hero battle-hero">
        <div class="vs" aria-hidden="true"><span class="avatar" data-member="{{ isMember }}">{{ avatarInitial }}</span><b>VS</b><span class="avatar q">?</span></div>
        <div class="hero-title display">{{ L.battles.challenge_friend }}</div>
        <div class="hero-sub">{{ L.battles.hero_sub }}</div>
        <button class="btn-main" onClick="{{ startBattle }}">{{ battleCta }}<svg class="ic"><use href="#i-arrow"></use></svg></button>
      </div>
      <div class="code-row">
        <input class="inp code" dir="ltr" placeholder="{{ L.battles.code_placeholder }}" value="{{ h2hCode }}" onChange="{{ setH2HCode }}" onKeyDown="{{ codeKey }}" autocapitalize="characters" spellcheck="false">
        <button class="btn-soft" onClick="{{ redeemCode }}">{{ L.battles.join }}</button>
      </div>

<script src="vendor/supabase.js"></script>
<script type="module">
  import { App } from './app.js';
  import { init } from './i18n.js';
  await init();
  // Phones fill the screen; tablets and desktops get their own layouts (app.css).
  const props = {
    // The iPhone app (Capacitor) has its own name on the App Store.
    appName: window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform() ? '24 Seconds or Less' : 'NBA Trivia',
    shareUrl: '20-0.app',
    streakGlow: true,
  };
  new App(props).mount(document.getElementById('root'), document.getElementById('screens'));
</script>
<script>
// Anything floating over the bottom of the page (a host's badge, a cookie bar): lift the app above it.
(function () {
  const ours = el => el.id === 'root' || /^(SCRIPT|TEMPLATE|STYLE|LINK|NOSCRIPT)$/.test(el.tagName) || el.tagName.toLowerCase() === 'svg';
  function measure() {
    let need = 0;
    for (const el of document.body.children) {
      if (ours(el)) continue;
      let hit = false;
      for (const b of [el, ...(el.shadowRoot ? el.shadowRoot.querySelectorAll('*') : [])]) {
        const r = b.getBoundingClientRect(), pos = getComputedStyle(b).position;
        if (r.width && r.height && (pos === 'fixed' || pos === 'absolute') && r.top > innerHeight * .55) { need = Math.max(need, innerHeight - r.top + 8); hit = true; }
      }
      // a closed widget we can't measure, but that names itself
      if (!hit && /netlify|badge/i.test(el.tagName + ' ' + el.id + ' ' + el.className)) need = Math.max(need, 72);
    }
    document.documentElement.style.setProperty('--overlay-bottom', Math.min(need, 140) + 'px');
  }
  new MutationObserver(() => setTimeout(measure, 60)).observe(document.body, { childList: true });
  addEventListener('resize', measure); addEventListener('load', () => setTimeout(measure, 300)); setTimeout(measure, 2500);
})();
</script>
