<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>NBA Trivia — 20-0</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="modernist.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="root"></div>
<template id="screens">
<div style="min-height:100vh;display:flex;justify-content:center;align-items:flex-start;background:#000">
<div style="{{ shellStyle }}">

  <!-- ═══ REGISTRATION ═══ -->
  <sc-if value="{{ atWelcome }}" hint-placeholder-val="{{ true }}">
    <div style="position:relative;display:flex;flex-direction:column;flex:1;min-height:0">
      <div style="position:absolute;top:0;left:0;right:0;height:46%"><image-slot id="v2-welcome" shape="rect" fit="cover" placeholder="Drop an arena or player image"></image-slot></div>
      <div style="position:relative;margin-top:auto;padding:var(--space-8) var(--space-4) var(--space-6);background:linear-gradient(to top,var(--color-bg) 58%,transparent);pointer-events:none">
        <div style="font-family:var(--font-heading);font-weight:800;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--color-accent)">{{ appName }}</div>
        <h1 style="font-size:60px;line-height:.9;letter-spacing:-0.05em;margin:var(--space-3) 0 var(--space-3)">KNOW<br>BALL.</h1>
        <p style="font-size:17px;line-height:1.3;color:var(--color-neutral-300);margin:0 0 var(--space-6);max-width:300px">One mistake ends your run. How long can you last?</p>
        <div style="display:grid;gap:var(--space-2);pointer-events:auto">
          <button class="btn btn-primary btn-block" onClick="{{ authApple }}" style="min-height:56px;font-size:15px;margin:0;padding-inline:var(--space-4);gap:10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16.4 12.8c0-2.5 2-3.7 2.1-3.8-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.7.9-.8 0-1.9-.9-3.1-.8-1.6 0-3.1.9-3.9 2.4-1.7 2.9-.4 7.2 1.2 9.5.8 1.2 1.7 2.4 3 2.4 1.2 0 1.7-.8 3.1-.8 1.5 0 1.9.8 3.1.8 1.3 0 2.1-1.2 2.9-2.3.9-1.3 1.3-2.6 1.3-2.7-.1 0-2.5-1-2.5-3.7zM14 5.4c.7-.8 1.1-2 1-3.1-1 0-2.2.7-2.9 1.5-.6.7-1.2 1.9-1 3 1.1.1 2.2-.6 2.9-1.4z"></path></svg>Continue with Apple</button>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2)">
            <button class="btn btn-secondary" onClick="{{ authGoogle }}" style="min-height:52px;font-size:14px;justify-content:flex-start;padding-inline:var(--space-3)">Google</button>
            <button class="btn btn-secondary" onClick="{{ goAuthEmail }}" style="min-height:52px;font-size:14px;justify-content:flex-start;padding-inline:var(--space-3)">Email</button>
          </div>
          <button class="btn btn-ghost" onClick="{{ playGuest }}" style="min-height:48px;justify-content:flex-start;padding-inline:0">Skip — play as guest</button>
        </div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ atAuth }}" hint-placeholder-val="{{ false }}">
    <div style="padding:var(--space-6) var(--space-4) var(--space-8)">
      <button class="btn btn-ghost" onClick="{{ backToWelcome }}" style="min-height:44px;justify-content:flex-start;padding-inline:0;margin-bottom:var(--space-3)">← Back</button>
      <h2 style="font-size:40px;letter-spacing:-0.04em;line-height:1;margin:0 0 var(--space-2)">{{ authTitle }}</h2>
      <p style="font-size:15px;color:var(--color-neutral-300);margin:0 0 var(--space-4)">{{ authSub }}</p>
      <div style="display:grid;gap:var(--space-3)">
        <div class="field"><label>Email</label><input class="input" type="email" placeholder="you@example.com" value="{{ authEmail }}" onChange="{{ setAuthEmail }}" style="min-height:50px"></div>
        <div class="field"><label>Password</label><input class="input" type="password" placeholder="At least 8 characters" value="{{ authPass }}" onChange="{{ setAuthPass }}" style="min-height:50px"></div>
        <sc-if value="{{ authHasErrors }}" hint-placeholder-val="{{ false }}"><div style="border-left:3px solid var(--color-accent);padding:var(--space-2) var(--space-3);font-size:13px;color:var(--color-accent-300)"><sc-for list="{{ authErrorList }}" as="e" hint-placeholder-count="1"><div>{{ e }}</div></sc-for></div></sc-if>
        <button class="btn btn-primary" onClick="{{ submitEmailAuth }}" style="min-height:54px;justify-content:flex-start;padding-inline:var(--space-4)">{{ authCta }}</button>
        <button class="btn btn-ghost" onClick="{{ toggleAuthMode }}" style="min-height:44px;justify-content:flex-start;padding-inline:0">{{ authToggleLabel }}</button>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ atUsername }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-direction:column;flex:1;padding:var(--space-6) var(--space-4) var(--space-6)">
      <div style="display:flex;gap:6px;margin-bottom:var(--space-6)"><sc-for list="{{ regDots }}" as="d" hint-placeholder-count="3"><div style="{{ d }}"></div></sc-for></div>
      <h2 style="font-size:44px;letter-spacing:-0.04em;line-height:.95;margin:0 0 var(--space-2)">CHOOSE YOUR USERNAME</h2>
      <p style="font-size:15px;color:var(--color-neutral-300);margin:0 0 var(--space-5)">This is how you appear on every leaderboard.</p>
      <div style="display:flex;align-items:center;gap:var(--space-2);border-bottom:2px solid var(--color-divider);padding-bottom:var(--space-2)">
        <span style="font-family:var(--font-heading);font-weight:800;font-size:32px;color:var(--color-neutral-500)">@</span>
        <input class="input" placeholder="ballgod" value="{{ unameDraft }}" onChange="{{ setUname }}" style="flex:1;min-height:56px;font-family:var(--font-heading);font-weight:800;font-size:28px;background:transparent;border:0;padding-inline:0">
      </div>
      <div style="{{ unameStatusStyle }}">{{ unameStatus }}</div>
      <button class="btn btn-primary btn-block" onClick="{{ claimUsername }}" disabled="{{ unameInvalid }}" style="min-height:56px;font-size:16px;margin-top:auto;padding-inline:var(--space-4)">CONTINUE</button>
    </div>
  </sc-if>

  <sc-if value="{{ atTeamPick }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-direction:column;flex:1;min-height:0">
      <div style="padding:var(--space-6) var(--space-4) var(--space-3)">
        <sc-if value="{{ regFlow }}" hint-placeholder-val="{{ true }}"><div style="display:flex;gap:6px;margin-bottom:var(--space-5)"><sc-for list="{{ regDots }}" as="d" hint-placeholder-count="3"><div style="{{ d }}"></div></sc-for></div></sc-if>
        <h2 style="font-size:44px;letter-spacing:-0.04em;line-height:.95;margin:0 0 var(--space-2)">WHO'S YOUR TEAM?</h2>
        <p style="font-size:15px;color:var(--color-neutral-300);margin:0 0 var(--space-3)">Unlocks a mode built entirely from their history.</p>
        <input class="input" placeholder="Search 30 teams" value="{{ teamSearch }}" onChange="{{ setTeamSearch }}" style="min-height:48px">
      </div>
      <div style="flex:1;overflow:auto;border-top:2px solid var(--color-divider)">
        <sc-for list="{{ teamList }}" as="t" hint-placeholder-count="12">
          <button onClick="{{ t.pick }}" style="{{ t.style }}">
            <div style="{{ t.markStyle }}">{{ t.abbr }}</div>
            <div style="flex:1;text-align:left"><div style="font-family:var(--font-heading);font-weight:800;font-size:17px;letter-spacing:-0.01em">{{ t.name }}</div><div style="font-size:12px;color:var(--color-neutral-400)">{{ t.meta }}</div></div>
            <sc-if value="{{ t.selected }}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" stroke-width="3" stroke-linecap="square"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>
          </button>
        </sc-for>
      </div>
      <div style="padding:var(--space-3) var(--space-4);border-top:2px solid var(--color-divider)">
        <button class="btn btn-primary btn-block" onClick="{{ saveTeam }}" disabled="{{ noTeamChosen }}" style="min-height:56px;font-size:16px;margin:0;padding-inline:var(--space-4)">{{ teamCta }}</button>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ atReady }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-direction:column;flex:1;padding:var(--space-6) var(--space-4) var(--space-6)">
      <div style="display:flex;gap:6px;margin-bottom:var(--space-6)"><sc-for list="{{ regDots }}" as="d" hint-placeholder-count="3"><div style="{{ d }}"></div></sc-for></div>
      <div style="{{ readyMarkStyle }}">{{ myTeamAbbr }}</div>
      <h2 style="font-size:52px;letter-spacing:-0.05em;line-height:.92;margin:var(--space-4) 0 var(--space-2)">READY?</h2>
      <p style="font-size:17px;color:var(--color-neutral-300);margin:0;max-width:300px">{{ readyLine }}</p>
      <button class="btn btn-primary btn-block" onClick="{{ startStreak }}" style="min-height:60px;font-size:17px;margin-top:auto;padding-inline:var(--space-4)">PLAY YOUR FIRST GAME<svg style="margin-left:auto" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></button>
    </div>
  </sc-if>

  <!-- ═══ HOME ═══ -->
  <sc-if value="{{ atHome }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-direction:column;flex:1;animation:fade .3s ease-out">
      <div style="display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4)">
        <div style="{{ avatarStyle }}">{{ avatarInitial }}</div>
        <div style="flex:1;min-width:0">
          <div style="font-family:var(--font-heading);font-weight:800;font-size:16px;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ handle }}</div>
          <div style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--color-neutral-400)"><span style="{{ teamDotStyle }}"></span>{{ homeSubline }}</div>
        </div>
        <div style="text-align:right"><div style="font-family:var(--font-heading);font-weight:800;font-size:18px;letter-spacing:-0.02em;color:var(--color-accent-400)">{{ globalRank }}</div><div style="font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-neutral-400)">Global</div></div>
      </div>

      <div style="position:relative;padding:var(--space-6) var(--space-4) var(--space-6);overflow:hidden">
        <sc-if value="{{ hasStreak }}" hint-placeholder-val="{{ false }}"><sc-for list="{{ embers }}" as="e" hint-placeholder-count="0"><div style="{{ e }}"></div></sc-for></sc-if>
        <div style="position:relative">
          <div style="display:flex;align-items:center;gap:7px;font-family:var(--font-heading);font-weight:800;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--color-accent)"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg>{{ streakLabel }}</div>
          <div style="{{ heroNumStyle }}">{{ heroStreak }}</div>
          <div style="display:flex;align-items:baseline;gap:var(--space-4);margin-top:var(--space-1)">
            <div><span style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-neutral-400)">Best </span><span style="font-family:var(--font-heading);font-weight:800;font-size:18px">{{ bestStreak }}</span></div>
            <div><span style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-neutral-400)">Accuracy </span><span style="font-family:var(--font-heading);font-weight:800;font-size:18px">{{ accuracy }}</span></div>
          </div>
          <div style="font-family:var(--font-heading);font-weight:800;font-size:24px;letter-spacing:-0.03em;margin-top:var(--space-4)">{{ heroPrompt }}</div>
          <button class="btn btn-primary btn-block" onClick="{{ startStreak }}" style="min-height:60px;font-size:17px;margin-top:var(--space-3);padding-inline:var(--space-4)">PLAY STREAK<svg style="margin-left:auto" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></button>
        </div>
      </div>

      <button onClick="{{ goTeamHub }}" style="all:unset;cursor:pointer;position:relative;display:block;border-top:2px solid var(--color-divider);color:var(--color-text)">
        <div style="position:absolute;top:0;left:54%;right:0;bottom:0"><image-slot id="v2-team" shape="rect" fit="cover" placeholder="Team image"></image-slot></div>
        <div style="position:relative;padding:var(--space-4) var(--space-4);background:linear-gradient(to right,var(--color-bg) 54%,color-mix(in srgb,var(--color-bg) 20%,transparent));pointer-events:none">
          <div style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-neutral-400);font-weight:800">Your team</div>
          <div style="font-family:var(--font-heading);font-weight:800;font-size:34px;letter-spacing:-0.04em;line-height:.98;margin-top:2px;max-width:230px">{{ teamHeadline }}</div>
          <div style="display:flex;align-items:center;gap:var(--space-3);margin-top:var(--space-3)">
            <span style="font-family:var(--font-heading);font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--color-accent)">{{ teamCtaLabel }} →</span>
            <sc-if value="{{ hasTeam }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;color:var(--color-neutral-400)">Best {{ teamBest }} · {{ teamAnswered }} answered</span></sc-if>
          </div>
        </div>
      </button>

      <div style="border-top:2px solid var(--color-divider)">
        <sc-for list="{{ homeRows }}" as="r" hint-placeholder-count="3">
          <button onClick="{{ r.go }}" style="all:unset;cursor:pointer;width:100%;box-sizing:border-box;display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--color-divider);color:var(--color-text)" style-hover="background:var(--color-surface)">
            <div style="flex:1;text-align:left"><div style="font-family:var(--font-heading);font-weight:800;font-size:15px">{{ r.title }}</div><div style="font-size:12px;color:var(--color-neutral-400)">{{ r.sub }}</div></div>
            <sc-if value="{{ r.badge }}" hint-placeholder-val="{{ false }}"><span class="tag tag-accent" style="font-weight:800">{{ r.badgeText }}</span></sc-if>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-neutral-500)" stroke-width="2.5" stroke-linecap="square"><path d="m9 6 6 6-6 6"></path></svg>
          </button>
        </sc-for>
      </div>

      <sc-if value="{{ hasRecentBadges }}" hint-placeholder-val="{{ false }}">
        <div style="padding:var(--space-4)">
          <div style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-neutral-400);font-weight:800;margin-bottom:var(--space-2)">Recent achievements</div>
          <div style="display:flex;flex-wrap:wrap;gap:var(--space-2)"><sc-for list="{{ recentBadges }}" as="b" hint-placeholder-count="2"><span class="tag tag-outline" style="font-weight:800;padding:7px 11px">{{ b }}</span></sc-for></div>
        </div>
      </sc-if>
    </div>
  </sc-if>

  <!-- ═══ PLAY ═══ -->
  <sc-if value="{{ atPlay }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-direction:column;flex:1;animation:fade .25s ease-out">
      <h2 style="font-size:40px;letter-spacing:-0.04em;line-height:.95;margin:0;padding:var(--space-6) var(--space-4) var(--space-4)">PICK YOUR<br>BATTLE</h2>
      <button onClick="{{ startStreak }}" style="all:unset;cursor:pointer;box-sizing:border-box;display:block;width:100%;background:var(--color-accent);color:#120800;padding:var(--space-5, 20px) var(--space-4)">
        <div style="display:flex;align-items:center;gap:8px;font-family:var(--font-heading);font-weight:800;font-size:11px;letter-spacing:.16em;text-transform:uppercase"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg>Main event</div>
        <div style="font-family:var(--font-heading);font-weight:800;font-size:46px;letter-spacing:-0.05em;line-height:1;margin-top:6px">STREAK</div>
        <div style="font-size:15px;margin-top:4px;opacity:.85">One mistake ends your run. Your best is {{ bestStreak }}.</div>
      </button>
      <button onClick="{{ goTeamHub }}" style="all:unset;cursor:pointer;box-sizing:border-box;display:flex;align-items:center;gap:var(--space-3);width:100%;padding:var(--space-4);border-bottom:2px solid var(--color-divider);color:var(--color-text)" style-hover="background:var(--color-surface)">
        <div style="{{ teamMarkStyle }}">{{ myTeamAbbr }}</div>
        <div style="flex:1;text-align:left"><div style="font-family:var(--font-heading);font-weight:800;font-size:26px;letter-spacing:-0.03em;line-height:1">YOUR TEAM</div><div style="font-size:14px;color:var(--color-neutral-300);margin-top:2px">{{ teamModeSub }}</div></div>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" stroke-width="2.5" stroke-linecap="square"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
      </button>
      <div style="padding:var(--space-4) var(--space-4) var(--space-2);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-neutral-400);font-weight:800">More ways to play</div>
      <sc-for list="{{ playModes }}" as="m" hint-placeholder-count="5">
        <button onClick="{{ m.pick }}" disabled="{{ m.locked }}" style="{{ m.style }}">
          <div style="flex:1;text-align:left"><div style="font-family:var(--font-heading);font-weight:800;font-size:17px;letter-spacing:-0.01em">{{ m.name }}</div><div style="font-size:13px;color:var(--color-neutral-400);margin-top:1px">{{ m.desc }}</div></div>
          <sc-if value="{{ m.locked }}" hint-placeholder-val="{{ false }}"><span class="tag tag-outline" style="font-weight:800">Soon</span></sc-if>
          <sc-if value="{{ m.hasStat }}" hint-placeholder-val="{{ false }}"><div style="font-family:var(--font-heading);font-weight:800;font-size:16px;color:var(--color-neutral-300)">{{ m.stat }}</div></sc-if>
        </button>
      </sc-for>
    </div>
  </sc-if>

  <!-- ═══ GAME ═══ -->
  <sc-if value="{{ atGame }}" hint-placeholder-val="{{ false }}">
    <div style="{{ gameShellStyle }}">
      <div style="display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4)">
        <button onClick="{{ quitGame }}" aria-label="Exit" style="all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;width:44px;height:44px;margin-left:-10px;color:var(--color-neutral-400)" style-hover="color:var(--color-text)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
        <div style="flex:1;font-family:var(--font-heading);font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-neutral-400)">{{ gameProgress }}</div>
        <sc-if value="{{ gameHasClock }}" hint-placeholder-val="{{ false }}"><div style="{{ clockStyle }}">{{ clock }}</div></sc-if>
        <div style="{{ streakChipStyle }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg>{{ gameStreak }}</div>
      </div>
      <div style="height:3px;background:var(--color-neutral-800)"><div style="{{ gameBarStyle }}"></div></div>

      <sc-if value="{{ gameVisible }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;flex-direction:column;flex:1;min-height:0;animation:in .22s ease-out">
          <div style="padding:var(--space-6) var(--space-4) var(--space-4)">
            <div style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent);font-weight:800;margin-bottom:var(--space-3)">{{ qKicker }}</div>

            <sc-if value="{{ qIsClues }}" hint-placeholder-val="{{ false }}">
              <h2 style="font-size:34px;letter-spacing:-0.04em;line-height:1;margin:0 0 var(--space-4)">WHO AM I?</h2>
              <div style="border-top:2px solid var(--color-divider)">
                <sc-for list="{{ clueRows }}" as="c" hint-placeholder-count="5">
                  <div style="{{ c.style }}">
                    <div style="font-size:9px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--color-accent-400);margin-bottom:3px">Clue {{ c.n }}</div>
                    <sc-if value="{{ c.locked }}" hint-placeholder-val="{{ false }}"><div style="font-family:var(--font-heading);font-weight:800;font-size:16px;color:var(--color-neutral-500)">— — —</div></sc-if>
                    <sc-if value="{{ c.isText }}" hint-placeholder-val="{{ true }}"><div style="font-size:17px;line-height:1.3;font-weight:600;text-wrap:pretty">{{ c.text }}</div></sc-if>
                    <sc-if value="{{ c.isPath }}" hint-placeholder-val="{{ false }}">
                      <sc-for list="{{ c.teams }}" as="tm" hint-placeholder-count="4">
                        <div style="display:grid;grid-template-columns:20px 1fr;gap:var(--space-2);min-height:36px">
                          <div style="position:relative"><div style="position:absolute;left:3px;top:9px;width:9px;height:9px;background:var(--color-accent)"></div><div style="{{ tm.lineStyle }}"></div></div>
                          <div style="padding:4px 0 8px;font-family:var(--font-heading);font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:-0.01em">{{ tm.name }}</div>

        </div>
        <sc-if value="{{ h2hHasError }}" hint-placeholder-val="{{ false }}"><div style="font-size:13px;color:var(--color-accent-300);margin-top:8px">{{ h2hError }}</div></sc-if>
      </div>
      <sc-if value="{{ h2hEmpty }}" hint-placeholder-val="{{ false }}">
        <div style="padding:var(--space-6) var(--space-4) 0"><div style="font-family:var(--font-heading);font-weight:800;font-size:24px;letter-spacing:-0.03em">NO BATTLES YET.</div><div style="font-size:14px;color:var(--color-neutral-300);margin-top:4px">Finish a run and challenge a friend to the exact same questions.</div></div>
      </sc-if>
      <sc-for list="{{ h2hRows }}" as="c" hint-placeholder-count="2">
        <button onClick="{{ c.open }}" style="{{ c.style }}">
          <div style="text-align:left"><div style="font-family:var(--font-heading);font-weight:800;font-size:16px">{{ c.opponent }}</div><div style="font-size:12px;color:var(--color-neutral-400)">{{ c.mode }} · {{ c.sub }}</div></div>
          <span style="{{ c.pillStyle }}">{{ c.result }}</span>
        </button>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{ atH2HIntro }}" hint-placeholder-val="{{ false }}">
    <div style="padding:var(--space-8) var(--space-4)">
      <div style="font-family:var(--font-heading);font-weight:800;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--color-accent)">You've been challenged</div>
      <h2 style="font-size:46px;letter-spacing:-0.05em;line-height:.93;margin:var(--space-3) 0 var(--space-3)">{{ chCreator }} THINKS THEY KNOW MORE.</h2>
      <div style="display:grid;grid-template-columns:1fr 1fr;border-top:2px solid var(--color-divider);border-bottom:2px solid var(--color-divider)">
        <div style="padding:var(--space-4) 0;border-right:1px solid var(--color-divider)"><div style="font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-neutral-400)">Mode</div><div style="font-family:var(--font-heading);font-weight:800;font-size:22px">{{ chModeLabel }}</div></div>
        <div style="padding:var(--space-4) 0 var(--space-4) var(--space-3)"><div style="font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-neutral-400)">Code</div><div style="font-family:var(--font-heading);font-weight:800;font-size:22px;letter-spacing:.06em">{{ chCodeLabel }}</div></div>
      </div>
      <p style="font-size:14px;color:var(--color-neutral-300);margin-top:var(--space-3)">Same questions, same order. Their score stays hidden until you finish.</p>
      <button class="btn btn-primary btn-block" onClick="{{ chAccept }}" style="min-height:58px;font-size:16px;margin-top:var(--space-4);padding-inline:var(--space-4)">ACCEPT</button>
    </div>
  </sc-if>

  <sc-if value="{{ atH2HMade }}" hint-placeholder-val="{{ false }}">
    <div style="padding:var(--space-8) var(--space-4)">
      <div style="font-family:var(--font-heading);font-weight:800;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--color-accent)">Challenge sent</div>
      <h2 style="font-size:46px;letter-spacing:-0.05em;line-height:.93;margin:var(--space-3) 0 var(--space-4)">BEAT MY SCORE.</h2>
      <div style="background:var(--color-accent);color:#120800;padding:var(--space-4)">
        <div style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;opacity:.8">Code</div>
        <div style="font-family:var(--font-heading);font-weight:800;font-size:54px;letter-spacing:.02em;line-height:1;margin-top:2px">{{ chCodeLabel }}</div>
        <div style="font-size:12px;margin-top:8px;opacity:.85">{{ chDeepLink }}</div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:var(--space-4)">
        <button class="btn btn-primary" onClick="{{ chShare }}" style="min-height:52px;justify-content:flex-start;padding-inline:var(--space-3)">Share</button>
        <button class="btn btn-secondary" onClick="{{ chCopy }}" style="min-height:52px;justify-content:flex-start;padding-inline:var(--space-3)">{{ copyLabel }}</button>
      </div>
      <button class="btn btn-ghost" onClick="{{ goH2H }}" style="min-height:44px;margin-top:8px;justify-content:flex-start;padding-inline:0">My battles</button>
    </div>
  </sc-if>

  <sc-if value="{{ atH2HResult }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-direction:column;flex:1;animation:fade .35s ease-out">
      <div style="{{ chResultHeroStyle }}">
        <div style="font-family:var(--font-heading);font-weight:800;font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.85">{{ chModeLabel }} battle</div>
        <div style="font-family:var(--font-heading);font-weight:800;font-size:68px;letter-spacing:-0.05em;line-height:.95;margin-top:var(--space-2)">{{ chResultTitle }}</div>
        <div style="font-size:15px;margin-top:var(--space-2);opacity:.9;text-wrap:pretty">{{ chResultSub }}</div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;border-bottom:2px solid var(--color-divider)">
        <sc-for list="{{ chScores }}" as="p" hint-placeholder-count="2"><div style="{{ p.style }}"><div style="font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-neutral-400)">{{ p.name }}</div><div style="font-family:var(--font-heading);font-weight:800;font-size:38px;letter-spacing:-0.03em;margin-top:2px">{{ p.value }}</div></div></sc-for>
      </div>
      <div style="padding:var(--space-4);display:grid;gap:10px">
        <button class="btn btn-primary btn-block" onClick="{{ chRematch }}" style="min-height:58px;font-size:16px;margin:0;padding-inline:var(--space-4)">REMATCH</button>
        <button class="btn btn-secondary btn-block" onClick="{{ chShare }}" style="min-height:48px;padding-inline:var(--space-4)">Share result</button>
      </div>
    </div>
  </sc-if>

  <!-- ═══ ADMIN · QUESTION BANK ═══ -->
  <sc-if value="{{ atAdmin }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-direction:column;flex:1">
      <div style="padding:var(--space-6) var(--space-4) var(--space-3)">
        <div style="font-family:var(--font-heading);font-weight:800;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--color-accent)">Master bank · {{ bankSeason }}</div>
        <h2 style="font-size:36px;letter-spacing:-0.04em;line-height:1;margin:var(--space-2) 0 var(--space-3)">QUESTION ENGINE</h2>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;border-top:2px solid var(--color-divider);border-bottom:2px solid var(--color-divider)">
          <sc-for list="{{ bankTotals }}" as="s" hint-placeholder-count="4"><div style="{{ s.style }}"><div style="font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-neutral-400)">{{ s.label }}</div><div style="font-family:var(--font-heading);font-weight:800;font-size:20px;letter-spacing:-0.03em;margin-top:2px">{{ s.value }}</div></div></sc-for>
        </div>
      </div>

      <div style="padding:0 var(--space-4) var(--space-4)">
        <div style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-neutral-400);font-weight:800;margin-bottom:8px">Inventory vs target</div>
        <div style="display:flex;align-items:baseline;gap:8px">
          <div style="font-family:var(--font-heading);font-weight:800;font-size:34px;letter-spacing:-0.04em">{{ chKnowledgePoints }}</div>
          <div style="font-size:12px;color:var(--color-neutral-400)">distinct knowledge points of {{ chTarget }} target</div>
        </div>
        <div style="height:6px;background:var(--color-neutral-800);margin-top:8px"><div style="{{ chTargetBarStyle }}"></div></div>
        <div style="font-size:12px;color:var(--color-accent-300);margin-top:8px;border-left:2px solid var(--color-accent);padding-left:9px;text-wrap:pretty">{{ chGapNote }}</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:var(--space-3);font-size:11px;color:var(--color-neutral-400)">
          <div>Generated from facts<br><b style="color:var(--color-text)">{{ chGenerated }}</b></div>
          <div>Duplicate KPs rejected<br><b style="color:var(--color-text)">{{ chDupesRejected }}</b></div>
          <div>Below quality gate<br><b style="color:var(--color-text)">{{ chQualityRejected }}</b></div>
          <div>Current / historical<br><b style="color:var(--color-text)">{{ chCurrentSplit }}</b></div>
        </div>
      </div>

      <div style="padding:0 var(--space-4) var(--space-4)">
        <div style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-neutral-400);font-weight:800;margin-bottom:8px">Mode pools · exclusive</div>
        <sc-for list="{{ chPools }}" as="pl" hint-placeholder-count="5">
          <div style="display:grid;grid-template-columns:1fr auto;gap:var(--space-3);align-items:center;padding:8px 0;border-bottom:1px solid var(--color-divider)">
            <div style="font-family:var(--font-heading);font-weight:800;font-size:14px">{{ pl.label }}</div>
            <div style="font-family:var(--font-heading);font-weight:800;font-size:18px;letter-spacing:-0.03em">{{ pl.count }}</div>
          </div>
        </sc-for>
        <div style="font-size:11px;color:var(--color-neutral-500);margin-top:8px;text-wrap:pretty">Every question belongs to exactly one pool, so no question reaches a player through two different modes.</div>
      </div>

      <div style="padding:0 var(--space-4) var(--space-4)">
        <div style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-neutral-400);font-weight:800;margin-bottom:8px">Difficulty mix vs target</div>
        <sc-for list="{{ chMix }}" as="m" hint-placeholder-count="5">
          <div style="display:grid;grid-template-columns:76px 1fr 74px;gap:10px;align-items:center;padding:5px 0">
            <div style="font-family:var(--font-heading);font-weight:800;font-size:12px;letter-spacing:.04em;text-transform:uppercase">{{ m.tier }}</div>
            <div style="position:relative;height:8px;background:var(--color-neutral-800)"><div style="{{ m.barStyle }}"></div><div style="{{ m.targetTickStyle }}"></div></div>
            <div style="font-size:11px;color:var(--color-neutral-400);text-align:right">{{ m.readout }}</div>
          </div>
        </sc-for>
      </div>

      <div style="padding:0 var(--space-4) var(--space-4)">
        <div style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-neutral-400);font-weight:800;margin-bottom:8px">Daily inventory · never repeats</div>
        <div style="display:flex;align-items:baseline;gap:8px"><div style="{{ chDailyStyle }}">{{ chDailyRemaining }}</div><div style="font-size:12px;color:var(--color-neutral-400)">unused · {{ chDailyRunway }}</div></div>
        <sc-if value="{{ chDailyLow }}" hint-placeholder-val="{{ false }}"><div style="font-size:12px;color:var(--color-accent);font-weight:800;margin-top:6px">⚠ LOW DAILY INVENTORY — top up the daily pool</div></sc-if>
      </div>

      <div style="padding:0 var(--space-4) var(--space-4)">
        <div style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-neutral-400);font-weight:800;margin-bottom:8px">Era coverage</div>
        <div style="display:flex;flex-wrap:wrap;gap:7px"><sc-for list="{{ chEras }}" as="e" hint-placeholder-count="8"><span class="tag tag-neutral" style="font-weight:800">{{ e }}</span></sc-for></div>
      </div>

      <div style="padding:0 var(--space-4) var(--space-4)">
        <div style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-neutral-400);font-weight:800;margin-bottom:8px">Pool health</div>
        <sc-for list="{{ poolRows }}" as="r" hint-placeholder-count="6">
          <div style="display:grid;grid-template-columns:1fr auto;gap:var(--space-3);align-items:center;padding:9px 0;border-bottom:1px solid var(--color-divider)">
            <div><div style="font-family:var(--font-heading);font-weight:800;font-size:14px">{{ r.label }}</div><div style="font-size:11px;color:var(--color-neutral-400)">{{ r.detail }}</div></div>
            <div style="{{ r.valueStyle }}">{{ r.available }}</div>
          </div>
        </sc-for>
      </div>

      <div style="padding:0 var(--space-4) var(--space-4)">
        <div style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-neutral-400);font-weight:800;margin-bottom:8px">Reuse window</div>
        <div style="display:flex;flex-wrap:wrap;gap:7px">
          <sc-for list="{{ retentionOpts }}" as="o" hint-placeholder-count="6"><button onClick="{{ o.pick }}" style="{{ o.style }}">{{ o.label }}</button></sc-for>
        </div>
        <div style="font-size:12px;color:var(--color-neutral-400);margin-top:8px;text-wrap:pretty">{{ retentionNote }}</div>
        <div style="display:flex;gap:8px;margin-top:var(--space-3)">
          <button class="btn btn-secondary" onClick="{{ toggleAutoPublish }}" style="min-height:42px;font-size:12px">{{ autoPublishLabel }}</button>
          <button class="btn btn-ghost" onClick="{{ resetHistory }}" style="min-height:42px;font-size:12px">Clear my history</button>
        </div>
      </div>

      <div style="padding:0 var(--space-4) var(--space-3);border-top:2px solid var(--color-divider);padding-top:var(--space-4)">
        <input class="input" placeholder="Search question text, player, team" value="{{ adminQ }}" onChange="{{ setAdminQ }}" style="min-height:46px">
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px">
          <select class="input" value="{{ adminStatus }}" onChange="{{ setAdminStatus }}" style="min-height:42px;font-size:13px" options="{{ statusOpts }}"></select>
          <select class="input" value="{{ adminMode }}" onChange="{{ setAdminMode }}" style="min-height:42px;font-size:13px" options="{{ modeOpts }}"></select>
          <select class="input" value="{{ adminDiff }}" onChange="{{ setAdminDiff }}" style="min-height:42px;font-size:13px" options="{{ diffOpts }}"></select>
        </div>
      </div>

      <div style="padding:0 var(--space-4) var(--space-2);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-neutral-400);font-weight:800">{{ adminCount }} matching</div>
      <sc-for list="{{ adminRows }}" as="r" hint-placeholder-count="8">
        <div style="{{ r.style }}">
          <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">
            <span style="font-family:var(--font-heading);font-weight:800;font-size:10px;letter-spacing:.06em;color:var(--color-neutral-500)">{{ r.id }}</span>
            <span style="{{ r.statusStyle }}">{{ r.status }}</span>
            <span class="tag tag-neutral">{{ r.diff }}</span>
            <span class="tag tag-neutral">{{ r.cat }}</span>
            <sc-if value="{{ r.isDynamic }}" hint-placeholder-val="{{ false }}"><span class="tag tag-outline" style="font-weight:800">Dynamic</span></sc-if>
          </div>
          <div style="font-size:14px;font-weight:600;line-height:1.3;margin-top:6px;text-wrap:pretty">{{ r.text }}</div>
          <div style="font-size:12px;color:var(--color-accent-400);margin-top:2px">✓ {{ r.correct }}</div>
          <sc-if value="{{ r.hasDupes }}" hint-placeholder-val="{{ false }}">
            <div style="font-size:12px;color:var(--color-accent-300);margin-top:6px;border-left:2px solid var(--color-accent);padding-left:8px">⚠ {{ r.dupeText }}</div>
          </sc-if>
          <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;font-size:11px;color:var(--color-neutral-400)">
            <div>Shown<br><b style="color:var(--color-text)">{{ r.shown }}</b></div>
            <div>Correct<br><b style="color:var(--color-text)">{{ r.correctPct }}</b></div>
            <div>Avg<br><b style="color:var(--color-text)">{{ r.avg }}</b></div>
            <div>Modes<br><b style="color:var(--color-text)">{{ r.modes }}</b></div>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:7px;margin-top:10px">
            <sc-for list="{{ r.actions }}" as="act" hint-placeholder-count="3"><button onClick="{{ act.run }}" style="{{ act.style }}">{{ act.label }}</button></sc-for>
          </div>
          <div style="font-size:10px;color:var(--color-neutral-500);margin-top:8px">{{ r.kp }} · pool {{ r.pool }} · quality {{ r.quality }}</div>
          <div style="font-size:10px;color:var(--color-neutral-500);margin-top:2px">{{ r.sourceLine }}</div>
        </div>
      </sc-for>
      <div style="padding:var(--space-4)"><button class="btn btn-secondary btn-block" onClick="{{ goProfileFromAdmin }}" style="min-height:46px;padding-inline:var(--space-4)">Back to profile</button></div>
    </div>
  </sc-if>

  <!-- ═══ NAV ═══ -->
  <sc-if value="{{ showNav }}" hint-placeholder-val="{{ false }}">
    <div style="height:68px;flex:none"></div>
    <div style="position:sticky;bottom:0;margin-top:auto;display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;background:var(--color-bg);border-top:2px solid var(--color-divider)">
      <sc-for list="{{ navItems }}" as="n" hint-placeholder-count="5">
        <button onClick="{{ n.pick }}" aria-label="{{ n.label }}" style="{{ n.style }}">
          <div style="{{ n.iconWrap }}">
            <sc-if value="{{ n.isHome }}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"><path d="m3 10 9-7 9 7v10H3z"></path><path d="M9 20v-6h6v6"></path></svg></sc-if>
            <sc-if value="{{ n.isPlay }}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7 3l14 9-14 9z"></path></svg></sc-if>
            <sc-if value="{{ n.isBoard }}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg></sc-if>
            <sc-if value="{{ n.isTeam }}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M6 5.5c3.5 2 8.5 2 12 0M6 18.5c3.5-2 8.5-2 12 0"></path></svg></sc-if>
            <sc-if value="{{ n.isProfile }}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"></path></svg></sc-if>
            <sc-if value="{{ n.badge }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;top:-3px;right:-5px;min-width:15px;height:15px;padding:0 4px;display:flex;align-items:center;justify-content:center;background:var(--color-accent);color:#120800;font-family:var(--font-heading);font-weight:800;font-size:9px">{{ n.badgeCount }}</div></sc-if>
          </div>
          <div style="font-family:var(--font-heading);font-weight:800;font-size:9px;letter-spacing:.08em;text-transform:uppercase">{{ n.label }}</div>
        </button>
      </sc-for>
    </div>
  </sc-if>

</div>
</div>
</template>
<script type="module">
  import { App } from './app.js';
  // Same props the design exposes. On a wide screen the app sits in a phone
  // frame, as in the design; on a phone it fills the viewport.
  const props = {
    appName: 'NBA TRIVIA',
    shareUrl: '20-0.app',
    phoneFrame: matchMedia('(min-width: 600px) and (min-height: 900px)').matches,
    streakGlow: true,
  };
  new App(props).mount(document.getElementById('root'), document.getElementById('screens'));
</script>
</body>
</html>
